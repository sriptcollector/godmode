name: GodMode
options:
  bundleIdPrefix: com.orionjones
  deploymentTarget: {iOS: "17.0"}
settings:
  DEVELOPMENT_TEAM: 482FP5Y9AN
  CODE_SIGN_STYLE: Automatic
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "0.2"
  CURRENT_PROJECT_VERSION: "1"
targets:
  GodMode:
    type: application
    platform: iOS
    sources: [GodMode]
    dependencies:
      - framework: Vendor/IDevice.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    info:
      path: GodMode/Info.plist
      properties:
        CFBundleDisplayName: GPS Spoofer
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: GPS Spoofer keeps a location session open so your fake location keeps holding in the background.
        UIBackgroundModes: [location]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: GPS Spoofer talks to your phone's own location service through LocalDevVPN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.orionjones.godmode
      GENERATE_INFOPLIST_FILE: NO
