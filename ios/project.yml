name: GodMode
options:
  bundleIdPrefix: com.orionjones
  deploymentTarget: {iOS: "17.0"}
settings:
  DEVELOPMENT_TEAM: 482FP5Y9AN
  CODE_SIGN_STYLE: Automatic
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "0.2"
  CURRENT_PROJECT_VERSION: "1"
targets:
  GodMode:
    type: application
    platform: iOS
    sources: [GodMode]
    info:
      path: GodMode/Info.plist
      properties:
        CFBundleDisplayName: GODMODE
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: GODMODE uses your location only to center the map.
        NSLocalNetworkUsageDescription: GODMODE talks to the gm gpsd helper on your Mac to move your phone's location.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.orionjones.godmode
      GENERATE_INFOPLIST_FILE: NO
