name: GodMode
options:
  bundleIdPrefix: com.orionjones
  deploymentTarget: {iOS: "17.0"}
settings:
  DEVELOPMENT_TEAM: 482FP5Y9AN
  CODE_SIGN_STYLE: Automatic
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "0.2"
  CURRENT_PROJECT_VERSION: "1"
targets:
  GodMode:
    type: application
    platform: iOS
    sources: [GodMode]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.orionjones.godmode
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: GODMODE
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIUserInterfaceStyle: Dark
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: GODMODE uses your location only to center the map.
